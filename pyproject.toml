[project]
name = "sack-knowledge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.3,<4", "mcp>=1.20,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
search = ["numpy>=2.3,<3", "onnxruntime>=1.24,<2", "tokenizers>=0.22,<1", "tinysegmenter==0.4"]

[tool.setuptools.package-data]
sack_knowledge = ["schema.sql"]
